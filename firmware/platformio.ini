; ============================================================
;  ESP32-CAM + SSD1315 OLED 桌面时钟
;  M0：点亮 + 自检 + OTA 通路
;  板子：AI-Thinker ESP32-CAM（4MB Flash，双 app 分区以支持 OTA）
;
;  注意：ini 里尽量不用行尾注释，避免某些解析器把注释当值
; ============================================================
[env:esp32cam]
platform      = espressif32
board         = esp32cam
framework     = arduino

; ---- 串口 ----
monitor_speed = 115200
; ESP32-CAM 接 FTDI 时 115200 最稳，熟了可以改 460800
upload_speed  = 115200

; ---- 分区表 ----
; 双 app（app0/app1），OTA 必需
board_build.partitions = min_spiffs.csv

; ---- 编译参数 ----
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -Wall

; ---- 依赖 ----
; 首次构建成功后建议把版本钉死，例如 olikraus/U8g2@^2.35.30
lib_deps =
  olikraus/U8g2
